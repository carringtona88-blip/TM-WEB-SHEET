<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TM Web Tracker</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="topbar" aria-label="Faction overview">
        <div class="brand">
          <img src="./tm-logo.png" alt="TM faction logo" />
          <div>
          <p class="eyebrow">Leader tools</p>
          <h1>TM Web Tracker</h1>
          </div>
        </div>
        <div class="sheet-status" id="sheetStatus" aria-live="polite">Loading sheet...</div>
      </section>

      <section class="controls" aria-label="Event finder controls">
        <label>
          <span>Monthly Tab</span>
          <select id="sheetSelect"></select>
        </label>
        <label>
          <span>Event field</span>
          <select id="eventSelect"></select>
        </label>
        <label>
          <span>Find</span>
          <select id="directionSelect">
            <option value="none">None</option>
            <option value="highest">Highest</option>
            <option value="lowest">Lowest</option>
          </select>
        </label>
        <label>
          <span>Results</span>
          <select id="resultLimitSelect">
            <option value="999">All</option>
            <option value="5">Top 5</option>
            <option value="10">Top 10</option>
            <option value="25">Top 25</option>
          </select>
        </label>
        <label>
          <span>Score filter</span>
          <select id="scoreFilterSelect">
            <option value="all">Include zeros</option>
            <option value="nonzero">Exclude zeros</option>
            <option value="below14k">Below 14k</option>
            <option value="below18m">Below 1.8m</option>
            <option value="below120">Below 120m</option>
            <option value="below80">Below 80m</option>
          </select>
        </label>
      </section>

      <section class="metrics" aria-label="Current sheet summary">
        <article>
          <span>Members In Tab</span>
          <strong id="memberCount">0</strong>
        </article>
        <article>
          <span>Current Month</span>
          <strong id="currentMonth">-</strong>
        </article>
      </section>

      <section class="dashboard-grid">
        <section class="panel finder" aria-label="Top five results">
          <div class="panel-head">
            <h2 id="finderTitle">Results</h2>
            <span id="finderMeta"></span>
          </div>
          <div id="finderList" class="rank-list"></div>
        </section>

        <section class="panel player" aria-label="Player monthly scores">
          <div class="panel-head">
            <h2 id="playerTitle">Player Scores</h2>
            <span id="playerMeta"></span>
          </div>
          <div class="player-search">
            <label class="search">
              <span>Search member</span>
              <input id="searchInput" type="search" placeholder="Type a player name..." />
            </label>
          </div>
          <div id="playerScores" class="score-grid"></div>
        </section>

        <section class="panel roster" aria-label="Roster table">
          <div class="panel-head">
            <h2>Roster Lookup</h2>
            <span id="rosterMeta"></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr id="tableHead"></tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <script src="./app.js?v=7"></script>
  </body>
</html>
